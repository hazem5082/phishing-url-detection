version: '3.8'

services:
  phishing-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishing-url-detection-api
    ports:
      - "5000:5000"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - AUTO_DOWNLOAD_DATASET=true
      - AUTO_TRAIN_MODELS=false
    volumes:
      - ./data:/app/data
      - ./models_saved:/app/models_saved
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
